# Rebuilds index.json and the article list in README.md after every push.
# nuitnoirecustom.ch reads index.json, so a new article appears on the website on its own (within ~15 minutes).
name: Index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check articles and build index
        run: node scripts/build-index.mjs
      - name: Commit index
        run: |
          if git diff --quiet -- index.json README.md; then echo "Index unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json README.md
          git commit -m "Index aktualisiert"
          git push
